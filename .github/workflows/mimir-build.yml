name: Mimir-Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: true
        default: 'alioth'
      ksu:
        description: 'Enable KernelSU'
        required: true
        type: choice
        options:
          - 'n'
          - 'y'
        default: 'n'
      droidspaces:
        description: 'Enable DroidSpaces'
        required: true
        type: choice
        options:
          - 'n'
          - 'y'
        default: 'n'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEVICE: ${{ github.event.inputs.device }}
      DEVICE_NAME: ${{ github.event.inputs.device }}
      KERNEL_NAME: Mimir Kernel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "America/Sao_Paulo"

      - name: Setup environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu jq zip curl git make python3 perl bc
          sudo apt-get clean
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Notify Build Started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=markdown" \
            -d "text=🚀 *New Mimir Kernel build started!*%0A%0A📦 *Repo:* \`${{ env.REPO_NAME }}\`%0A📱 *Device:* \`${{ env.DEVICE }}\`%0A🌿 *Branch:* \`${{ github.ref_name }}\`%0A🔐 *KernelSU:* \`${{ github.event.inputs.ksu }}\`%0A🧩 *DroidSpaces:* \`${{ github.event.inputs.droidspaces }}\`%0A⏳ *Please wait...*" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"🔍 View log\",\"url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]]}"

      - name: Run build script
        id: build
        run: |
          chmod +x build.sh
          # -z sempre ativado no Actions
          ARGS="${{ env.DEVICE }} -z"
          if [ "${{ github.event.inputs.ksu }}" = "y" ]; then
            ARGS="$ARGS -ksu"
          fi
          # Passa a escolha de DroidSpaces para o script
          export ENABLE_DROIDSPACES=${{ github.event.inputs.droidspaces }}
          ./build.sh $ARGS

      - name: Send Notification (Success)
        if: success() && env.ZIP_DOWNLOAD_LINK != ''
        run: |
          MESSAGE="✅ *Mimir Kernel build ready!*%0A%0A🛠️ *Clang:* \`${{ env.CLANG_VERSION }}\`%0A⏱️ *Time:* ${{ env.BUILD_DURATION }}%0A🔐 *KSU:* \`${{ github.event.inputs.ksu }}\`%0A🧩 *DroidSpaces:* \`${{ github.event.inputs.droidspaces }}\`%0A🌐 *Gofile:* \`${{ env.GOFILE_SERVER }}\`%0A🔐 *SHA256:* \`${{ env.ZIP_SHA256 }}\`"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=markdown" \
            -d "text=$MESSAGE" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"📥 Download\",\"url\":\"${{ env.ZIP_DOWNLOAD_LINK }}\"}]]}"

      - name: Send Notification (Failure)
        if: failure()
        run: |
          LOG_URL="${{ env.ERROR_LOG_URL }}"
          if [ -z "$LOG_URL" ] || [ "$LOG_URL" == "null" ]; then
            LOG_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          MESSAGE="❌ *Kernel build failed!*%0A🛠️ *Clang:* \`${{ env.CLANG_VERSION || 'Error' }}\`%0A🆔 *Run:* [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=$MESSAGE" \
            -d "reply_markup={\"inline_keyboard\":[[{\"text\":\"📂 View Error Log\",\"url\":\"$LOG_URL\"}]]}"

      - name: Send Notification (Cancelled)
        if: cancelled()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ⚠️ *Workflow Cancelled!*
            🆔 *Run:* [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            👤 *Status:* Interrupted by user.

      - name: Cleanup
        if: always()
        run: rm -rf out tc *.zip
